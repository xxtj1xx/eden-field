[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-field"
version = "0.1.0"
description = "Local-first AI stack and field tools for tradespeople. Phone first. Home server later."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "TJay", email = "eden@spliceflow.app" }
]
keywords = [
    "local-llm",
    "termux",
    "fiber-optics",
    "field-tools",
    "privacy",
    "llama.cpp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
eden = "eden.cli:main"

[project.urls]
Homepage = "https://github.com/xxtj1xx/eden-field"
Issues = "https://github.com/xxtj1xx/eden-field/issues"
Source = "https://github.com/xxtj1xx/eden-field"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
